version: 2

suite:
  name: qvhighlights
  description: TimePLE evaluation on QVHighlights val.
  output_root: evaluation/outputs

dataset_ref: ../datasets/qvhighlights_val.yaml

defaults:
  execution:
    python: python
  metrics:
    profile: qvhighlights
    recall_thresholds: [0.5, 0.7]
    map_thresholds: [0.5, 0.75]
  output:
    save_every: 20
    log_level: INFO
    save_predictions: true
    save_failed_samples: true
    resume_from: null
  distributed:
    enabled: false
    auto_from_env: true
    shard_output: true
    auto_assign_local_gpus: true

jobs:
  - name: timeple_8b
    model_ref: ../models/timeple_8b.yaml
