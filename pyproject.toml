[project]
name = "timeple"
version = "0.1.0"
description = "TimePLE temporal span representation and post-training toolkit"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10,<3.13"
dependencies = [
  "numpy>=1.26",
  "pyyaml>=6.0",
  "torch>=2.4",
  "transformers==4.57.6",
]

[project.optional-dependencies]
sft = ["ms-swift==3.12.6"]
rl = ["verl @ git+https://github.com/hiyouga/EasyR1.git@07cae10c28d686a6604546617663d32e4f1089e6"]
data-pipeline = ["pillow>=10"]
data-gemini = ["google-genai>=1", "pillow>=10"]
data-vllm = ["qwen-vl-utils>=0.0.14", "vllm>=0.11"]
eval = [
  "accelerate>=1.12",
  "decord>=0.6",
  "pillow>=10",
  "qwen-vl-utils[decord]>=0.0.14",
  "vllm[video]==0.19.0",
]
dev = ["pytest>=8", "ruff>=0.11"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/timeple"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.uv]
package = true
conflicts = [[{ extra = "sft" }, { extra = "rl" }]]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]
